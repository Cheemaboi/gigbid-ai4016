services:
  - type: web
    name: gigbid-api
    runtime: docker
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MARKETPLACE_MODE
        value: demo
      - key: CORS_ORIGINS
        value: https://cheemaboi.github.io
  - type: web
    name: gigbid-portfolio-mcp
    runtime: docker
    dockerfilePath: ./infra/docker/portfolio-mcp.Dockerfile
    dockerContext: .
    healthCheckPath: /mcp
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: PUBLIC_HOST
        sync: false
