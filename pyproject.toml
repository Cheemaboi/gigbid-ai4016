[project]
name = "gigbid"
version = "0.1.0"
description = "Human-approved freelance proposal copilot for AI-4016"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "mcp>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["apps*", "agent*", "rag*", "mcp_servers*"]

